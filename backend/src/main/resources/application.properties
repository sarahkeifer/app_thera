spring.datasource.url=jdbc:h2:file:./data/testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# PDF-Anhaenge an Aufgaben-Vorlagen (siehe TaskController#uploadFile):
# Spring erlaubt standardmaessig nur 1MB pro Datei/Request - hier auf 10MB
# angehoben, passend zur clientseitigen Pruefung in TaskPoolView.tsx.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB